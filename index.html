<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Community Reach — who has gone quiet, and who is near them</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">

  <header class="masthead">
    <div>
      <h1>Community Reach</h1>
      <p class="sub">Who has gone quiet, and who is near enough to reach them.
        <!-- One door. The data notes are a section of Docs, so a second link
             opening the same section in a sheet was chrome, not a second
             answer. The sheet machinery is still in app.js and unreferenced;
             it comes out in the next pass rather than in a pre-demo deploy. -->
        <a href="about.html" class="about-link">Docs</a></p>
    </div>
    <div class="spacer"></div>
    <div class="counters" id="counters" aria-live="polite"></div>
  </header>

  <!-- EVERY FILTER IS ADDITIVE AND EVERY LAYER IS A TOGGLE.
       Row one scopes the population: where, and what you are looking for.
       Row two is what gets drawn at all. Rows three and four are the chips for
       whatever is switched on, full width because they are the main filter
       surface and not an afterthought tucked inside a group. The working set
       sits apart on the right, because a place your work collects is not
       another filter. -->
  <div class="controls">
    <div class="family" aria-label="Who exists">
      <div class="group">
        <label class="label" for="f-place">Place</label>
        <!-- One control, not a Region toggle plus a Country dropdown. Those two
             were ANDed, so United States + Brazil asked for people in both at
             once and returned nobody. -->
        <select id="f-place" class="field"><option value="">Global</option></select>
      </div>

      <!-- Only shown while Place is the United States: the state is derived
           from free text and that derivation is US-only. -->
      <div class="group" id="g-state" hidden>
        <label class="label" for="f-state">State</label>
        <select id="f-state" class="field"><option value="">All states</option></select>
      </div>

      <!-- No "Who" toggle. It switched the entire population, which made it a
           mode: the same link showed 96 people or 7,032 depending on a control
           two clicks away, and it could land on the wrong one. Everyone in the
           two Slack channels is always the population now, and the people
           holding a Community Team role are LABELLED instead -- a badge in the
           list and the record, a ringed marker on the map, the Role column in
           the table, and "role" is searchable. Nobody is hidden to make them
           findable. -->
      <div class="group">
        <label class="label" for="q">Search</label>
        <input id="q" class="field" type="search"
               placeholder="Name, place, handle, or role" autocomplete="off">
      </div>
    </div>

    <div class="family" aria-label="Draw">
      <div class="group">
        <span class="label">View</span>
        <div class="seg" role="group" aria-label="View">
          <button id="v-map"   aria-pressed="true">Map</button>
          <button id="v-table" aria-pressed="false">Table</button>
        </div>
      </div>

      <div class="group">
        <span class="label">Show</span>
        <!-- People, Meetups, Automatticians. Filled from the layer registry in
             app.js; adding a layer is a descriptor there, not another button
             here. People is in this strip too: "toggle everything" is not true
             if one of the three is an always-on background. -->
        <div class="seg" role="group" aria-label="Layers" id="layer-toggles"></div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="family is-action" aria-label="Working set">
      <div class="group">
        <span class="label">Working set</span>
        <div class="seg" role="group" aria-label="Working set">
          <button id="set-btn" aria-pressed="false"
            title="People, meetups and Automatticians you have marked while moving around. Survives filtering and reload.">Empty</button>
        </div>
      </div>
    </div>

    <!-- The chips: people statuses, then one row per layer that has values
         worth choosing between. Full-width lines of their own, because inside a
         group the meetup row alone was 777px wide and pushed the whole bar to
         three rows -- and because these are the main filter surface, not a
         detail. Each is empty, and therefore invisible, until its layer is on. -->
    <div id="status-filters" class="layer-filters"></div>
    <div id="layer-filters" class="layer-filters"></div>
  </div>

  <!-- Source order is column order: the grid auto-places these, and #map is
       deliberately last so Triage reads queue, record, map. #map is never
       re-parented once Leaflet has initialised on it; it is placed, not moved. -->
  <div class="stage" id="stage">
    <section class="rail" id="queue" aria-label="People who have gone quiet"></section>

    <section class="rail" id="record" aria-label="Selected record">
      <div class="state" id="side-state"><strong>Loading…</strong>Reading the dataset.</div>
    </section>

    <div id="map" role="application" aria-label="Map of community supporters"></div>

    <div class="tablewrap" id="tablewrap" hidden>
      <div class="tabletools">
        <p class="label" id="tcount">—</p>
        <div class="spacer"></div>
        <div class="group">
          <label class="label" for="f-rows">Rows</label>
          <select id="f-rows" class="field">
            <option>25</option><option selected>50</option><option>100</option>
            <option>200</option><option>250</option>
          </select>
        </div>
        <button class="btn" id="pg-prev" aria-label="Previous page">Prev</button>
        <span class="label tabular" id="pg-label">1</span>
        <button class="btn" id="pg-next" aria-label="Next page">Next</button>
        <button class="btn primary" id="do-csv">Export CSV</button>
      </div>
      <div class="scroll">
        <table id="tbl">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Built on open from the loaded dataset, never hand-written: every figure in
     it is computed from the same file the map is drawing, so it cannot go stale
     the way a paragraph of numbers in a doc does. -->
<dialog id="datanote" class="sheet" aria-label="About this data"></dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
